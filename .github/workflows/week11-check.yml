name: Week 11 Check

on:
  push:
    branches: [unit4/week-11]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: labs/week-11/source

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build
        run: npm install && npm run build

      - name: Check Week 11
        run: npm run check
